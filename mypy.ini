[mypy]
# Mypy type checking configuration
# Ensures type safety for course data standardization module

# Basic configuration
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
show_error_codes = True
show_column_numbers = True
pretty = True

# Gradually enable strict mode (avoid affecting existing code)
disallow_untyped_defs = False
disallow_any_generics = False
disallow_subclassing_any = False

# Strict checking for data normalizer module
[mypy-backend.utils.data_normalizer]
disallow_untyped_defs = True
disallow_any_unimported = False
disallow_any_expr = False
disallow_any_decorated = False
disallow_any_explicit = False
strict_optional = True
strict_equality = True
check_untyped_defs = True

# Strict checking for validators module
[mypy-src.utils.validators]
disallow_untyped_defs = True
strict_optional = True
check_untyped_defs = True

# Ignore type checking for third-party libraries
[mypy-PyQt6.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-bs4.*]
ignore_missing_imports = True

[mypy-hypothesis.*]
ignore_missing_imports = True

[mypy-lxml.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True
